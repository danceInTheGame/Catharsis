name: hskhelp
description: "A new Flutter project."
publish_to: 'none'
version: 3.2.0+6

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab.json
    - assets/grammar_rules.json
    - assets/grammar_exercises.json
  fonts:
    - family: HskHelp
      fonts:
        - asset: assets/fonts/HskHelp-Regular.ttf
          weight: 400
        - asset: assets/fonts/HskHelp-Bold.ttf
          weight: 700
